name: Elixir Dev Publish

env:
  DEBIAN_FRONTEND: noninteractive
  DEPENDENCY_FILE: mix.lock
  ELIXIR_VERSION: 1.18.3
  JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  OTP_VERSION: 27.3
  RELEVANT_FILES: "mix.lock mix.exs lib priv config test"
  REPOSITORY: absinthe_helpers
  RUNNER_OS: ubuntu24
  SHA: ${{ github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs: {}

jobs:
  dev-publish:
    name: Dev Publish
    runs-on: runs-on,runner=4cpu-linux-x64
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - name: Checkout latest codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ env.sha }}
          clean: false
          persist-credentials: true
      - name: Get SHA sum (HASH) of relevant files
        id: hash
        shell: bash
        run: |
          git config --global --add safe.directory /__w/${{ env.REPOSITORY }}/${{ env.REPOSITORY }}
          echo "Get SHA sum (HASH) of relevant files"
          HASH="$(git ls-tree ${{ env.SHA }} -- ${{ env.RELEVANT_FILES }} | sha1sum | cut -d' ' -f1)"
          echo "BUILD HASH FOR THE CODEBASE IS: $HASH"
          echo "IT WILL BE USED TO DETERMINE ELIGIBILITY OF THE CODEBASE FOR THE RELEASE"
          echo "APPROVAL PRODUCED BY SUCCESSFULL CHECKS EXECUTION WILL LAND IN CACHE"
          echo "HASH=$HASH" >> $GITHUB_OUTPUT
      - name: Check for CI successes
        uses: step-security/runs-on-cache/restore@e61ed9b0206c630e9a6bb5f12ca4cd78ae7bbe93 # v5.0.7
        with:
          key: ${{ runner.os }}-${{ env.REPOSITORY }}-approval-${{ steps.hash.outputs.HASH }}
          path: approval.txt
          fail-on-cache-miss: true
      - name: Setup mise
        uses: step-security/mise-action@6e96d2ffbc65c037f23c78818f2a339d6cf830f7 # v4.2.0
      - name: Install Hex + Rebar
        run: mix local.hex --force && mix local.rebar --force
      - name: Get dependencies
        shell: bash
        run: |
          echo "Getting dependencies"
          mix deps.get
      - name: Mark package version with dev suffix
        shell: bash
        run: |
          sed -i "s/version: \"[[:digit:]]\+\.[[:digit:]]\+\.[[:digit:]]\+/&-git-$(git rev-parse --verify --short=4 HEAD)/" mix.exs
      - name: Publish dev package
        shell: bash
        env:
          # `fresha` org key with `api:write` -- see ci.yaml's Publish Package
          # step for why a `repository:fresha` key cannot publish this package.
          HEX_API_KEY: ${{ secrets.GH_FRESHAENGINEERING_ABSINTHE_HELPERS_HEX_PM_API_KEY }}
        run: |
          echo "Publishing dev package"
          mix hex.publish --yes
