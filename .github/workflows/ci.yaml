name: Elixir CI Checks

env:
  DEBIAN_FRONTEND: noninteractive
  DEPENDENCY_FILE: mix.lock
  ELIXIR_VERSION: 1.18.3
  JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  OTP_VERSION: 27.3
  RELEVANT_FILES: "mix.lock mix.exs lib priv config test"
  REPOSITORY: absinthe_helpers
  RUNNER_OS: ubuntu22
  SHA: ${{ github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - synchronize
      - opened
      - reopened

jobs:
  static:
    name: Static Checks (Elixir ${{ matrix.versions.elixir-version }})
    runs-on: runs-on,runner=4cpu-linux-x64
    outputs:
      HASH: ${{ steps.hash.outputs.HASH }}
    strategy:
      fail-fast: false
      matrix:
        versions:
          - {
              elixir-version: 1.18.3,
              otp-version: 27.3,
              runner-os: "ubuntu22",
            }
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - name: Checkout latest codebase
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SHA }}
          clean: false
          persist-credentials: true
      - name: Setup mise
        uses: step-security/mise-action@2796166110dee826668caddd4bffedae5116e7cd # v4.2.0
      - name: Install Hex + Rebar
        run: mix local.hex --force && mix local.rebar --force
      - name: Get SHA sum (HASH) of relevant files
        id: hash
        run: |
          git config --global --add safe.directory /__w/${{ env.repository }}/${{ env.repository }}
          echo "Get SHA sum (HASH) of relevant files"
          HASH="$(git ls-tree ${{ env.SHA }} -- ${{ env.RELEVANT_FILES }} | sha1sum | cut -d' ' -f1)"
          echo "BUILD HASH FOR THE CODEBASE IS: $HASH"
          echo "HASH=$HASH" >> $GITHUB_OUTPUT
      - uses: step-security/runs-on-cache@c5b0cba15d05488ebc630ad8d1e95b3d9b35ac73 # v5.0.7
        id: deps-cache
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-${{ matrix.versions.elixir-version }}-${{ matrix.versions.otp-version }}-precompile-deps-dev-${{ hashFiles('mix.lock') }}
      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          MIX_ENV: dev
        run: |
          echo "Installing dependencies"
          mix deps.get
          mix deps.compile
      - uses: step-security/runs-on-cache@c5b0cba15d05488ebc630ad8d1e95b3d9b35ac73 # v5.0.7
        id: build-cache
        with:
          path: "**/*"
          key: ${{ runner.os }}-${{ matrix.versions.elixir-version }}-${{ matrix.versions.otp-version }}-compile-dev-${{ steps.hash.outputs.HASH }}
      - name: Compile with warning as --warnings-as-errors
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          echo "Compiling the app with --warnings-as-errors"
          mix compile --warnings-as-errors --force
      - name: Run credo
        run: |
          echo "Running credo"
          mix credo --strict
      - name: Run format
        run: |
          echo "Running format"
          mix format --check-formatted --dry-run
      - name: Run publish --dry-run
        env:
          # --dry-run never uploads, but it still calls GET /users/me, and an
          # *empty* HEX_API_KEY makes that raise instead of degrading. Use the
          # org read key, which already exists, so this step keeps working
          # regardless of the package-scoped write key's rollout.
          HEX_API_KEY: ${{ secrets.GH_FRESHAENGINEERING_HEX_PM_API_KEY }}
        run: |
          echo "Running publish --dry-run"
          mix hex.publish --dry-run

  test:
    name: Unit Tests (Elixir ${{ matrix.versions.elixir-version }})
    runs-on: runs-on,runner=2cpu-linux-x64
    strategy:
      fail-fast: false
      matrix:
        versions:
          - {
              elixir-version: 1.18.3,
              otp-version: 27.3,
              runner-os: "ubuntu22",
            }
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - name: Checkout latest codebase
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SHA }}
          clean: false
          persist-credentials: true
      - name: Setup mise
        uses: step-security/mise-action@2796166110dee826668caddd4bffedae5116e7cd # v4.2.0
      - name: Install Hex + Rebar
        run: mix local.hex --force && mix local.rebar --force
      - name: Get SHA sum (HASH) of relevant files
        id: hash
        run: |
          git config --global --add safe.directory /__w/${{ env.repository }}/${{ env.repository }}
          echo "Get SHA sum (HASH) of relevant files"
          HASH="$(git ls-tree ${{ env.SHA }} -- ${{ env.RELEVANT_FILES }} | sha1sum | cut -d' ' -f1)"
          echo "BUILD HASH FOR THE CODEBASE IS: $HASH"
          echo "HASH=$HASH" >> $GITHUB_OUTPUT
      - uses: step-security/runs-on-cache@c5b0cba15d05488ebc630ad8d1e95b3d9b35ac73 # v5.0.7
        id: deps-cache
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-${{ matrix.versions.elixir-version }}-${{ matrix.versions.otp-version }}-precompile-deps-test-${{ hashFiles('mix.lock') }}
      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          MIX_ENV: test
        run: |
          echo "Installing dependencies"
          mix deps.get
          mix deps.compile
      - uses: step-security/runs-on-cache@c5b0cba15d05488ebc630ad8d1e95b3d9b35ac73 # v5.0.7
        id: build-cache
        with:
          path: "**/*"
          key: ${{ runner.os }}-${{ matrix.versions.elixir-version }}-${{ matrix.versions.otp-version }}-compile-test-${{ steps.hash.outputs.HASH }}
      - name: Compile with MIX_ENV=test
        if: steps.build-cache.outputs.cache-hit != 'true'
        env:
          MIX_ENV: test
        run: |
          echo "Compiling the app with MIX_ENV=test"
          mix compile --force
      - name: Run tests
        run: |
          echo "Running tests"
          mix test --trace

  permit:
    name: Permit Package Publishing
    timeout-minutes: 25
    needs: [static, test]
    runs-on: runs-on,runner=1cpu-linux-x64
    outputs:
      PUBLISH: ${{ steps.permit.outputs.PUBLISH }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      - name: Verify eligibility for publishing the package
        uses: freshaengineering/platform-tribe-actions/elixir/permit@38cf7c5b442e7595fdacfd9b2c247d234cfa7592 # main
        id: permit
        with:
          repository: ${{ env.REPOSITORY }}
          sha: ${{ env.SHA }}
          # Must match dev-publish.yaml's HASH inputs, or the approval cache
          # key it restores will not match the one saved here. The action's
          # default omits `priv`.
          relevant-files: ${{ env.RELEVANT_FILES }}
          runner-os: ${{ env.RUNNER_OS }}

  publish:
    name: Publish Hex Package
    needs: [permit]
    runs-on: runs-on,runner=2cpu-linux-x64
    if: needs.permit.outputs.PUBLISH == 'true' && github.event_name == 'push'
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          use-policy-store: true
          api-key: ${{ secrets.GH_FRESHAENGINEERING_STEP_SECURITY_API_KEY }}

      # elixir/publish checks out the SHA itself, so no separate
      # actions/checkout step is needed here.
      - name: Publish Package
        uses: freshaengineering/platform-tribe-actions/elixir/publish@38cf7c5b442e7595fdacfd9b2c247d234cfa7592 # main
        with:
          repository: ${{ env.REPOSITORY }}
          sha: ${{ env.SHA }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Package-scoped write key for the upload. The org read key only
          # satisfies the action's unconditional `mix hex.organization auth
          # fresha` step -- absinthe_helpers is a public hex.pm package with
          # no private deps, so nothing here actually reads the fresha org.
          # HEX_ORGANIZATION_WRITE_KEY, which used to do both, is revoked.
          hex-token: ${{ secrets.GH_FRESHAENGINEERING_ABSINTHE_HELPERS_HEX_PM_API_KEY }}
          hex-organization-key: ${{ secrets.GH_FRESHAENGINEERING_HEX_PM_API_KEY }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          runner-os: ${{ env.RUNNER_OS }}
          working-directory: ${{ github.workspace }}
